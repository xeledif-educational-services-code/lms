<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeledif Maths LMS — Teacher Dashboard</title>

<style>
  :root {
    --text:#1a1a1a; --text-sec:#555;
    --border:#e5e5e5; --bg-sec:#f8f8f8;
    --good-bg:#EAF3DE; --good-fg:#27500A; --good-border:#C0DD97;
    --mid-bg:#FAEEDA;  --mid-fg:#633806;  --mid-border:#FAC775;
    --bad-bg:#FAECE7;  --bad-fg:#712B13;  --bad-border:#F0997B;
    --accent:#5B21B6; --accent-dark:#4C1D95;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         background:#f5f5f5; color:var(--text); padding:2rem 1rem 4rem; }
  .wrap { max-width:1100px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { font-size:13px; color:var(--text-sec); margin-bottom:20px; }
  .sub a { color:var(--accent); text-decoration:none; font-weight:600; }
  .sub a:hover { text-decoration:underline; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--border);
           background:#fff; cursor:pointer; font-size:13px; font-family:inherit; }
  button:hover { background:#f0f0f0; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary:hover { background:var(--accent-dark); }
  button.danger { background:var(--bad-bg); color:var(--bad-fg); border-color:var(--bad-border); }
  button.small { padding:4px 10px; font-size:11px; border-radius:6px; }

  .pupil { background:#fff; border:1px solid var(--border); border-radius:12px;
           padding:1.25rem 1.5rem; margin-bottom:1.5rem; }
  .pupil-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
                margin-bottom:10px; }
  .pupil-head h2 { font-size:18px; flex:1; display:flex;
                   align-items:center; gap:10px; flex-wrap:wrap; }
  .pill { display:inline-block; font-size:11px; font-weight:700;
          padding:3px 10px; border-radius:10px; }
  .pill.good { background:var(--good-bg); color:var(--good-fg); border:0.5px solid var(--good-border); }
  .pill.mid  { background:var(--mid-bg);  color:var(--mid-fg);  border:0.5px solid var(--mid-border); }
  .pill.bad  { background:var(--bad-bg);  color:var(--bad-fg);  border:0.5px solid var(--bad-border); }

  .kpis { display:flex; gap:18px; flex-wrap:wrap; font-size:12px;
          color:var(--text-sec); margin:6px 0 16px; }
  .kpis strong { color:var(--text); font-size:14px; }

  .step-block { border-top:1px solid #eee; padding:14px 0; }
  .step-block:first-of-type { border-top:1px solid #eee; }
  .step-head { display:flex; align-items:center; gap:10px;
               flex-wrap:wrap; margin-bottom:8px; }
  .step-head h3 { font-size:15px; flex:1; }
  .step-meta { display:flex; gap:16px; flex-wrap:wrap; font-size:12px;
               color:var(--text-sec); margin-bottom:6px; }
  .step-meta strong { color:var(--text); }

  .trend { display:flex; align-items:flex-end; gap:2px; height:32px;
           margin:8px 0 12px; padding:0 2px; }
  .trend-bar { flex:1; min-width:6px; background:var(--bad-bg);
               border-radius:2px 2px 0 0; position:relative; }
  .trend-bar.good { background:var(--good-fg); }
  .trend-bar.mid  { background:var(--mid-fg); }
  .trend-bar.bad  { background:var(--bad-fg); }
  .trend-labels { display:flex; gap:2px; font-size:9px;
                  color:var(--text-sec); padding:0 2px; }
  .trend-labels span { flex:1; min-width:6px; text-align:center; }

  .attempt-list { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .attempt { border:1px solid var(--border); border-radius:8px;
             background:var(--bg-sec); overflow:hidden; }
  .attempt-head { display:flex; align-items:center; gap:10px;
                  padding:8px 12px; cursor:pointer; font-size:12px;
                  user-select:none; flex-wrap:wrap; }
  .attempt-head:hover { background:#f0f0f0; }
  .attempt-head .num { font-weight:700; }
  .attempt-head .date { color:var(--text-sec); font-size:11px; }
  .attempt-head .score { font-weight:700; margin-left:auto; }
  .attempt-head .arrow { font-size:10px; opacity:.6; transition:transform .15s; }
  .attempt.open .attempt-head .arrow { transform:rotate(90deg); }
  .attempt-body { display:none; padding:10px 12px;
                  border-top:1px solid var(--border); }
  .attempt.open .attempt-body { display:block; }

  .q-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(105px, 1fr));
            gap:5px; margin-top:6px; }
  .q-cell { font-size:11px; padding:5px 7px; border-radius:7px;
            border:0.5px solid var(--border); background:#fff; line-height:1.35; }
  .q-cell.first  { background:var(--good-bg); border-color:var(--good-border); color:var(--good-fg); }
  .q-cell.retry  { background:var(--mid-bg);  border-color:var(--mid-border);  color:var(--mid-fg); }
  .q-cell.fail   { background:var(--bad-bg);  border-color:var(--bad-border);  color:var(--bad-fg); }
  .q-cell .qlab  { font-weight:700; display:block; margin-bottom:1px; }
  .q-cell .qdet  { opacity:.8; }

  .empty { color:#888; font-size:13px; padding:2rem 0; text-align:center; }

  @media (max-width: 480px) {
    body { padding:1rem .5rem 3rem; }
    .pupil { padding:1rem; }
    .kpis { gap:10px; }
  }
</style>

<!-- Firebase SDK (compat build) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Your Firebase integration -->
<script src="firebase-integration.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Teacher Dashboard</h1>

  <div id="auth-bar" style="margin-bottom:1rem;"></div>

  <div class="sub">
    Shows pupil progress from this browser and the cloud (when signed in).
    <a href="#" id="pupilLink" style="margin-left:8px;">Set / change pupil name</a>
    &nbsp;·&nbsp;
    <a href="index.html">← Back to lessons</a>
  </div>

  <div class="tools">
    <button class="primary" onclick="exportCSV()">⬇ Export ALL (CSV)</button>
    <button onclick="exportJSON()">⬇ Export ALL (JSON)</button>
    <button onclick="document.getElementById('importFile').click()">📤 Import pupil's score</button>
    <button onclick="location.reload()">🔄 Refresh</button>
    <button class="danger" onclick="clearAll()">🗑 Clear ALL local progress</button>
    <button id="migrateBtn" style="display:none;" onclick="migrateLocalToCloud()">☁ Upload local to cloud</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>

  <div id="root"></div>
</div>

<script>
const KEY = 'xeledif.progress.v2';
const PUPIL_KEY = 'xeledif.pupil';

function readAll() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch { return {}; }
}
function writeAll(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

function bucket(firstTry, total) {
  if (!total) return { cls:'', label:'—' };
  const pct = firstTry / total;
  if (pct >= 0.8) return { cls:'good', label: Math.round(pct*100) + '%' };
  if (pct >= 0.5) return { cls:'mid',  label: Math.round(pct*100) + '%' };
  return { cls:'bad', label: Math.round(pct*100) + '%' };
}

function trendClass(pct) {
  if (pct >= 0.8) return 'good';
  if (pct >= 0.5) return 'mid';
  return 'bad';
}

function render() {
  const all = readAll();
  const root = document.getElementById('root');

  // Group: pupil → step → array of attempts
  const byPupil = {};
  Object.values(all).forEach(rec => {
    if (!rec || !rec.pupil) return;
    // Skip smoke-test documents created during Firebase debugging
    if (rec.stepId === 'test-step' || (rec.attemptId || '').startsWith('smoke-test-')) return;

    byPupil[rec.pupil] = byPupil[rec.pupil] || {};
    byPupil[rec.pupil][rec.stepId] = byPupil[rec.pupil][rec.stepId] || {
      stepLabel: rec.stepLabel,
      attempts: []
    };
    byPupil[rec.pupil][rec.stepId].attempts.push(rec);
  });

  if (!Object.keys(byPupil).length) {
    root.innerHTML = '<div class="empty">No progress recorded yet. Once a pupil answers a question, it will appear here.</div>';
    return;
  }

  root.innerHTML = Object.entries(byPupil).map(([pupil, stepsMap]) => {
    const steps = Object.entries(stepsMap).map(([stepId, { stepLabel, attempts }]) => {
      attempts.sort((a, b) => (a.attemptNumber || 0) - (b.attemptNumber || 0));
      return { stepId, stepLabel, attempts };
    }).sort((a, b) => {
      const sa = a.attempts[0] || {};
      const sb = b.attempts[0] || {};
      const t = (sa.term || '').localeCompare(sb.term || '');
      if (t) return t;
      const tp = (sa.topic || '').localeCompare(sb.topic || '');
      if (tp) return tp;
      return (sa.stepNumber || 0) - (sb.stepNumber || 0);
    });

    // Pupil aggregates
    let totalAttempts = 0, totalQuestions = 0, totalFirstTry = 0, totalSolved = 0, totalWrong = 0;
    steps.forEach(({ attempts }) => {
      attempts.forEach(rec => {
        totalAttempts++;
        const ex = Object.values(rec.exercises || {});
        totalQuestions += ex.length;
        totalFirstTry += ex.filter(e => e.firstTry === true).length;
        totalSolved += ex.filter(e => e.correct > 0).length;
        totalWrong += rec.wrong || 0;
      });
    });
    const pBucket = bucket(totalFirstTry, totalQuestions);

    // Priority focus: steps below 50% first-try with full path
    const weakSteps = steps
      .map(({ stepLabel, attempts }) => {
        const sample = attempts.find(a => a.term || a.topic) || {};
        let qs = 0, first = 0;
        attempts.forEach(rec => {
          const ex = Object.values(rec.exercises || {});
          qs += ex.length;
          first += ex.filter(e => e.firstTry === true).length;
        });
        const pct = qs ? first / qs : 0;
        return {
          term: sample.term || '',
          topic: sample.topic || '',
          stepNumber: sample.stepNumber || 0,
          stepLabel,
          pct, qs, first
        };
      })
      .filter(s => s.pct < 0.5 && s.qs > 0)
      .sort((a, b) => a.pct - b.pct);

    const focusHtml = weakSteps.length
      ? `<div style="background:#FAECE7;border:1px solid #F0997B;border-radius:10px;padding:10px 14px;margin:8px 0 12px;">
           <div style="font-size:12px;font-weight:700;color:#712B13;margin-bottom:6px;">⚠️ Priority focus</div>
           <div style="font-size:12px;color:#712B13;line-height:1.6;">
             ${weakSteps.map(s => {
               const path = [s.term, s.topic, s.stepNumber ? 'Step ' + s.stepNumber : '', s.stepLabel]
                 .filter(Boolean).join(' · ');
               return `${path}: ${Math.round(s.pct*100)}% first-try`;
             }).join('<br>')}
           </div>
         </div>`
      : '';

    const stepBlocks = steps.map(({ stepId, stepLabel, attempts }) => {
      const sample = attempts.find(a => a.term || a.topic) || {};
      const termName  = sample.term  || '';
      const topicName = sample.topic || '';
      const stepNum   = sample.stepNumber || '';

      let allQ = 0, allFirst = 0, allSolved = 0, allWrong = 0;
      attempts.forEach(rec => {
        const ex = Object.values(rec.exercises || {});
        allQ += ex.length;
        allFirst += ex.filter(e => e.firstTry === true).length;
        allSolved += ex.filter(e => e.correct > 0).length;
        allWrong += rec.wrong || 0;
      });
      const stepBucket = bucket(allFirst, allQ);

      const trendBars = attempts.map(rec => {
        const ex = Object.values(rec.exercises || {});
        const first = ex.filter(e => e.firstTry === true).length;
        const total = ex.length || 1;
        const pct = first / total;
        const cls = trendClass(pct);
        const heightPct = Math.max(10, Math.round(pct * 100));
        return `<div class="trend-bar ${cls}" style="height:${heightPct}%"
                     title="Attempt ${rec.attemptNumber}: ${first}/${total} first-try (${Math.round(pct*100)}%)"></div>`;
      }).join('');
      const trendLabels = attempts.map(rec =>
        `<span>${rec.attemptNumber}</span>`
      ).join('');

      // Most-missed questions across all attempts
      const qWrongTotals = {};
      attempts.forEach(rec => {
        Object.entries(rec.exercises || {}).forEach(([num, e]) => {
          qWrongTotals[num] = (qWrongTotals[num] || 0) + (e.wrong || 0);
        });
      });
      const hotQs = Object.entries(qWrongTotals)
        .filter(([, n]) => n > 0)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);
      const hotHtml = hotQs.length
        ? `<div style="font-size:11px;color:var(--text-sec);margin-top:8px;">
             <strong>Most-missed questions:</strong>
             ${hotQs.map(([num, n]) => `Q${num} (${n}✗)`).join(' · ')}
           </div>`
        : '';

      const attemptRows = attempts.slice().reverse().map(rec => {
        const ex = Object.entries(rec.exercises || {})
          .sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
        const firstTry = ex.filter(([, e]) => e.firstTry === true).length;
        const solved = ex.filter(([, e]) => e.correct > 0).length;
        const b = bucket(firstTry, ex.length);

        const perQ = ex.map(([num, e]) => {
          const isFirst  = e.firstTry === true;
          const isRetry  = e.firstTry === false && e.correct > 0;
          const isFail   = e.correct === 0;
          const cls = isFirst ? 'first' : isRetry ? 'retry' : isFail ? 'fail' : '';
          const icon = isFirst ? '✅' : isRetry ? '⚠️' : '❌';
          const time = e.timeOnTaskMs ? Math.round(e.timeOnTaskMs / 1000) + 's' : '—';
          const wrong = e.wrong ? `${e.wrong}✗` : '0✗';
          return `<div class="q-cell ${cls}">
            <span class="qlab">${icon} Q${num}</span>
            <span class="qdet">${wrong} · ${time}</span>
          </div>`;
        }).join('');

        const started = rec.startedAt ? new Date(rec.startedAt).toLocaleString() : '—';
        const status = rec.completed ? 'submitted' : 'incomplete';

        return `
          <div class="attempt">
            <div class="attempt-head" onclick="this.parentElement.classList.toggle('open')">
              <span class="num">Attempt ${rec.attemptNumber}</span>
              <span class="date">${started} · ${status}</span>
              <span class="score" style="color:${
                b.cls === 'good' ? 'var(--good-fg)' :
                b.cls === 'mid'  ? 'var(--mid-fg)' :
                                   'var(--bad-fg)'}">
                ${firstTry}/${ex.length} first-try
              </span>
              <span class="arrow">▶</span>
            </div>
            <div class="attempt-body">
              <div class="step-meta">
                <span>Solved: <strong>${solved}/${ex.length}</strong></span>
                <span>Wrong attempts: <strong>${rec.wrong || 0}</strong></span>
                <span>Questions touched: <strong>${ex.length}</strong></span>
              </div>
              <div class="q-grid">${perQ}</div>
            </div>
          </div>`;
      }).join('');

      return `
        <div class="step-block">
          <div class="step-head">
            <h3>
              <span style="font-size:11px;color:var(--text-sec);font-weight:600;display:block;margin-bottom:2px;">
                ${termName}${topicName ? ' · ' + topicName : ''}${stepNum ? ' · Step ' + stepNum : ''}
              </span>
              ${stepLabel}
            </h3>
            <span class="pill ${stepBucket.cls}">${stepBucket.label} aggregate</span>
          </div>
          <div class="step-meta">
            <span>Attempts: <strong>${attempts.length}</strong></span>
            <span>Total questions: <strong>${allQ}</strong></span>
            <span>Aggregate first-try: <strong>${allFirst}/${allQ}</strong></span>
            <span>Aggregate solved: <strong>${allSolved}/${allQ}</strong></span>
            <span>Total wrong clicks: <strong>${allWrong}</strong></span>
          </div>
          ${attempts.length >= 2 ? `
            <div style="font-size:11px;color:var(--text-sec);margin-top:6px;">Progress trend (first-try % per attempt):</div>
            <div class="trend">${trendBars}</div>
            <div class="trend-labels">${trendLabels}</div>
          ` : ''}
          ${hotHtml}
          <div class="attempt-list">${attemptRows}</div>
        </div>`;
    }).join('');

    return `
      <div class="pupil">
        <div class="pupil-head">
          <h2>${pupil}
            <span class="pill ${pBucket.cls}">${pBucket.label} aggregate</span>
          </h2>
          <button class="small" onclick="exportPupilJSON('${pupil.replace(/'/g, "\\'")}')">⬇ Export ${pupil}</button>
          <button class="small" onclick="exportPupilCSV('${pupil.replace(/'/g, "\\'")}')">⬇ CSV</button>
        </div>
        <div class="kpis">
          <span>Steps attempted: <strong>${steps.length}</strong></span>
          <span>Attempts recorded: <strong>${totalAttempts}</strong></span>
          <span>Questions answered: <strong>${totalQuestions}</strong></span>
          <span>First-try correct: <strong>${totalFirstTry}</strong></span>
          <span>Eventually solved: <strong>${totalSolved}</strong></span>
          <span>Total wrong clicks: <strong>${totalWrong}</strong></span>
        </div>
        ${focusHtml}
        ${stepBlocks}
      </div>`;
  }).join('');
}

/* ── Exports ── */
function pupilRecords(name) {
  const all = readAll();
  const out = {};
  Object.entries(all).forEach(([k, rec]) => {
    if (rec.pupil === name) out[k] = rec;
  });
  return out;
}

function exportPupilJSON(name) {
  const blob = new Blob([JSON.stringify(pupilRecords(name), null, 2)],
                        { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function exportPupilCSV(name) {
  downloadCSV(buildRows(pupilRecords(name)),
              `${name}-progress-${new Date().toISOString().slice(0,10)}.csv`);
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(readAll(), null, 2)],
                        { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `xeledif-progress-ALL-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function exportCSV() {
  downloadCSV(buildRows(readAll()),
              `xeledif-progress-ALL-${new Date().toISOString().slice(0,10)}.csv`);
}

function buildRows(data) {
  const rows = [[
    'Pupil','Term','Topic','Step Number','Step','Attempt #',
    'Started At','Completed','Exercise','First Try','Correct','Wrong','Time on Task (s)'
  ]];
  Object.values(data).forEach(rec => {
    const ex = rec.exercises || {};
    const base = [
      rec.pupil,
      rec.term || '',
      rec.topic || '',
      rec.stepNumber || '',
      rec.stepLabel || rec.stepId,
      rec.attemptNumber || 1,
      rec.startedAt || '',
      rec.completed ? 'yes' : 'no'
    ];
    if (!Object.keys(ex).length) {
      rows.push([...base, '(no questions answered)', '', '', '', '']);
      return;
    }
    Object.entries(ex).forEach(([num, e]) => {
      rows.push([
        ...base,
        'Q' + num,
        e.firstTry === true ? 'yes' : e.firstTry === false ? 'no' : '',
        e.correct,
        e.wrong,
        e.timeOnTaskMs ? Math.round(e.timeOnTaskMs / 1000) : ''
      ]);
    });
  });
  return rows;
}

function downloadCSV(rows, filename) {
  const csv = rows.map(r =>
    r.map(cell => {
      const s = String(cell ?? '');
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(',')
  ).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

/* ── Import ── */
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const imported = JSON.parse(event.target.result);
      if (typeof imported !== 'object' || Array.isArray(imported)) {
        throw new Error('Not a progress file');
      }
      const existing = readAll();
      let added = 0, replaced = 0;
      Object.entries(imported).forEach(([k, rec]) => {
        if (!rec || typeof rec !== 'object' || !rec.pupil) return;
        if (existing[k]) replaced++;
        else added++;
        existing[k] = rec;
      });
      writeAll(existing);
      render();
      alert(`Imported successfully.\n\nAdded: ${added}\nUpdated: ${replaced}`);
    } catch (err) {
      alert('Could not read that file.\n\n' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function clearAll() {
  if (!confirm('This deletes ALL pupil progress on this DEVICE only.\n\n' +
               'Data already in the cloud will not be deleted.\n\nContinue?')) return;
  localStorage.removeItem(KEY);
  localStorage.removeItem('xeledif.activeAttempt');
  render();
}

document.getElementById('pupilLink').addEventListener('click', e => {
  e.preventDefault();
  const current = localStorage.getItem(PUPIL_KEY) || '';
  const name = prompt('Set the pupil name for this device:', current);
  if (name !== null) {
    localStorage.setItem(PUPIL_KEY, name.trim() || 'Unknown');
    alert('Pupil set to: ' + (name.trim() || 'Unknown') +
          '\nReload the lessons page to start a fresh session for this pupil.');
  }
});



/* ─── Boot: cloud is source of truth, local is a read-through cache ─── */
(async function boot() {
  // ── 1. Show whatever's cached immediately (avoids blank flash)
  render();

  // ── 2. Wait for Firebase auth role
  const role = await (typeof waitForRole === 'function' ? waitForRole() : Promise.resolve(null));

  if (!role) {
    console.log('[dashboard] Not signed in — showing cached data only.');
    updateUploadButtonState();
    return;
  }

  console.log('[dashboard] Signed in as', role, '— cloud is now the source of truth.');

  // ── 3. Callback fired on every Firestore snapshot
  const onCloudUpdate = (cloudData) => {
    // Reconcile on EVERY snapshot, not just once. Previously this
    // whole block was skipped once xeledif.migrationDone was '1',
    // which meant any NEW local-only attempt recorded after that
    // point (like Prosper's) was invisible to this check — and the
    // "cloud is the truth" overwrite below then erased it from
    // localStorage. That was the cause of scores flickering and
    // disappearing.
    const localSnapshot = readAll();
    const localAttempts = Object.values(localSnapshot).filter(
      rec => rec && rec.attemptId &&
             !rec.attemptId.startsWith('smoke-test-') &&
             rec.stepId !== 'test-step'
    );

    const cloudIds = new Set(Object.keys(cloudData));
    const toUpload = localAttempts.filter(rec => !cloudIds.has(rec.attemptId));

    if (toUpload.length > 0) {
      console.log('[dashboard] Reconciling', toUpload.length, 'local attempt(s) not yet in the cloud...');
      Promise.all(toUpload.map(rec => cloudWriteAttempt(rec)))
        .then(() => {
          console.log('[dashboard] Reconciliation complete.');
          localStorage.setItem('xeledif.migrationDone', '1');
        })
        .catch(err => {
          console.warn('[dashboard] Reconciliation upload failed:', err);
          // Leave things as-is — we'll retry on the next snapshot.
        });
      // Don't overwrite the cache yet. Wait for the next snapshot,
      // which will include whatever we just uploaded.
      return;
    }

    localStorage.setItem('xeledif.migrationDone', '1');
    // Cloud is now the truth — replace the cache wholesale.
    localStorage.setItem(KEY, JSON.stringify(cloudData));
    render();
    updateUploadButtonState();
  };

  if (role === 'teacher') {
    if (typeof cloudSubscribeAll === 'function') cloudSubscribeAll(onCloudUpdate);
  } else {
    if (typeof cloudSubscribeMy === 'function') cloudSubscribeMy(onCloudUpdate);
  }
})();



/* ─── Upload-local-to-cloud button (manual fallback) ─── */
function updateUploadButtonState() {
  const btn = document.getElementById('migrateBtn');
  if (!btn) return;

  const done = localStorage.getItem('xeledif.migrationDone') === '1';
  if (done) {
    btn.style.display = 'none';
    return;
  }

  const local = readAll();
  const meaningful = Object.values(local).filter(
    rec => rec && rec.attemptId &&
           !rec.attemptId.startsWith('smoke-test-') &&
           rec.stepId !== 'test-step'
  ).length;

  if (meaningful > 0) {
    btn.style.display = 'inline-block';
    btn.textContent = `☁ Upload ${meaningful} local attempt${meaningful === 1 ? '' : 's'} to cloud`;
  } else {
    btn.style.display = 'none';
  }
}

async function migrateLocalToCloud() {
  if (typeof getFirebaseUser !== 'function' || !getFirebaseUser()) {
    alert('You must be signed in to upload.');
    return;
  }

  const all = readAll();
  const entries = Object.values(all).filter(
    rec => rec && rec.attemptId &&
           !rec.attemptId.startsWith('smoke-test-') &&
           rec.stepId !== 'test-step'
  );

  if (!entries.length) {
    alert('No local attempts to upload.');
    return;
  }

  const ok = confirm(
    `Upload ${entries.length} local attempt(s) to the cloud?\n\n` +
    `This is a one-time operation. Afterwards, the dashboard will ` +
    `always reflect whatever is in the cloud.`
  );
  if (!ok) return;

  const btn = document.getElementById('migrateBtn');
  if (btn) { btn.disabled = true; btn.textContent = '☁ Uploading...'; }

  let uploaded = 0, failed = 0;
  for (const rec of entries) {
    try {
      await cloudWriteAttempt(rec);
      uploaded++;
    } catch (err) {
      console.warn('Upload failed for', rec.attemptId, err);
      failed++;
    }
  }

  localStorage.setItem('xeledif.migrationDone', '1');
  alert(
    `Upload complete.\n\nUploaded: ${uploaded}` +
    (failed ? `\nFailed: ${failed}` : '') +
    `\n\nThe dashboard now reflects cloud data only.`
  );
  updateUploadButtonState();
}
</script>
